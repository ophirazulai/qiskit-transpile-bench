[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "qiskit-transpile-bench"
version = "0.1.0"
description = "Benchmark harness that decides whether an evolved Qiskit revision improves transpilation over a baseline."
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
qiskit-transpile-bench = "qtb.cli:main"

[project.optional-dependencies]
verifier = ["qiskit==2.5.2", "numpy==2.3.3", "sympy==1.14.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "qiskit==2.5.2",
    "sympy==1.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qtb", "worker/qtb_worker", "verifier/qtb_verifier"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "qtb/data/profiles"
"fixtures" = "qtb/data/fixtures"
"envs" = "qtb/data/envs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "worker", "verifier", "tests"]
extend-exclude = ["design"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
